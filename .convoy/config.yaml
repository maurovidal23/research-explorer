version: 1

defaults:
  model: nan/deepseek-v4-flash

pipelines:
  reliability-full-cycle:
    description: "Implement entirely with NaN DeepSeek, then evaluate independently with NaN GLM 5.3 Flash and NaN Qwen 3.8 Flash until the verified score reaches 90."
    steps:
      - agent: implementer
        model: nan/deepseek-v4-flash
        advisor: false
        reports: none
      - agent: patterns
        model: nan/deepseek-v4-flash
        advisor: false
      - agent: security
        model: nan/deepseek-v4-flash
        advisor: false
      - agent: design
        model: nan/deepseek-v4-flash
        advisor: false
      - agent: tests
        model: nan/deepseek-v4-flash
        advisor: false
        reports: none
      - goal:
          target: 90
          maxIterations: 5
          plateau: 3
          improve:
            briefStep: fix
            steps:
              - agent: goal-fixer
                name: fix
                model: nan/deepseek-v4-flash
                advisor: false
                reports: none
                diff: true
                prdHistory: true
          measure:
            steps:
              - parallel:
                  - agent: quality-scorer
                    name: score
                    models: [nan/glm5.3-flash, nan/qwen3.8-flash]
                    reports: none
                    diff: true
                    prdHistory: true
              - agent: quality-score-report
                name: score-report
                model: nan/glm5.3-flash
                reports: [score]
                verify: true
                diff: true
                prdHistory: true
