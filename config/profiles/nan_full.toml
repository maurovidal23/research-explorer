# NaN full profile — no concurrency limits (for paid / higher tiers)

log_level = "INFO"

[llm]
base_url = "https://api.nan.builders/v1"
api_key_env = "NAN_API_KEY"
max_concurrent = 5
rpm = 60
explorer_model = "qwen3.6"
judge_model = "deepseek-v4-flash"
embedding_model = "qwen3-embedding"
rerank_model = "rerank"
temperature = 0.6
max_tokens = 2000

[aco]
colony_size = 30
max_concurrent = 5
k_per_turn = 6
alpha = 1.0
beta = 3.0
rho = 0.1
epsilon = 0.1
tau_min = 0.1
tau_max = 10.0
lambda_elite = 0.5

[quality]
w_self = 0.25
w_peers = 0.25
w_virgin = 0.25
w_structural = 0.25
peer_aggregation = "reputation"

[direction]
ref_weight = 0.6
cites_weight = 0.4

[heuristica]
w_sim = 0.6
w_citas = 0.2
w_recencia = 0.2
eta_llm = false

[providers]
default = "semantic_scholar"
active = ["semantic_scholar", "openalex", "pubmed", "arxiv"]

[providers.semantic_scholar]
rate = 1
period = 1
concurrency = 5
timeout = 30.0
api_key_env = "S2_API_KEY"

[providers.openalex]
rate = 10
period = 1
concurrency = 10
timeout = 30.0
api_key_env = "OPENALEX_API_KEY"

[providers.pubmed]
rate = 10
period = 1
concurrency = 5
timeout = 30.0
api_key_env = "PUBMED_API_KEY"

[providers.arxiv]
rate = 1
period = 3
concurrency = 3
timeout = 30.0

[budget]
type = "convergence"
max_fetches = 5000
max_time_seconds = 14400

[convergence]
plateau_T = 15
epsilon = 0.005
theta = 8.0

[scheduler]
gamma = 0.5
delta = 0.3

[storage]
db_path = "data/explorer.db"
cache_dir = "data/.cache"

[reference_mapping]
enabled = true
batch_size = 10
max_concurrent_batches = 2
max_retries = 2
lease_seconds = 300
model = ""
max_completion_tokens_per_batch = 1500
min_parse_confidence = 0.3
allow_provisional_nodes = true
max_entries = 0
mapper_version = "v1"
prompt_version = "v1"
