# Quick experiment profile — minimal cost, fast iteration.
# arXiv-only (free, no API keys), tiny colony, small budget.
# Use: uv run research-explorer explore -c config/profiles/quick.toml <arxiv-id> "query"

log_level = "INFO"

[llm]
base_url = "https://api.nan.builders/v1"
api_key_env = "NAN_API_KEY"
max_concurrent = 3
rpm = 60
explorer_model = "qwen3.6"
judge_model = "deepseek-v4-flash"
embedding_model = "qwen3-embedding"
rerank_model = "rerank"
temperature = 0.6
max_tokens = 2500

[aco]
colony_size = 3
max_concurrent = 2
k_per_turn = 2
alpha = 1.0
beta = 3.0
rho = 0.1
epsilon = 0.2
tau_min = 0.1
tau_max = 10.0
lambda_elite = 0.5

[quality]
w_self = 0.25
w_peers = 0.25
w_virgin = 0.25
w_structural = 0.25
peer_aggregation = "median"

[direction]
ref_weight = 0.8
cites_weight = 0.2

[heuristica]
w_sim = 0.6
w_citas = 0.2
w_recencia = 0.2
eta_llm = false

[providers]
default = "arxiv"
active = ["arxiv"]

[providers.arxiv]
rate = 1
period = 3
concurrency = 3
timeout = 30.0

[budget]
type = "fetches"
max_fetches = 12
max_time_seconds = 600

[convergence]
plateau_T = 3
epsilon = 0.01
theta = 5.0

[scheduler]
gamma = 0.5
delta = 0.3

[storage]
db_path = "data/quick.db"
cache_dir = "data/.cache"
