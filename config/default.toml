# Default config — NaN free-tier profile (K=3, 60rpm)
# Copy this to config/local.toml and adjust API keys.

log_level = "INFO"

[llm]
base_url = "https://api.nan.builders/v1"
api_key_env = "NAN_API_KEY"
max_concurrent = 5        # NaN limit: 5 concurrent
rpm = 60                  # NaN limit: 60 rpm
explorer_model = "qwen3.6"
judge_model = "deepseek-v4-flash"
embedding_model = "qwen3-embedding"
rerank_model = "rerank"
temperature = 0.6
max_tokens = 2000
evaluation_max_tokens = 4000
structured_output_attempts = 2

[aco]
colony_size = 15          # N — total agents in the colony
max_concurrent = 3        # K — active agents per oleada (your concurrency limit)
k_per_turn = 4            # fetches per agent per turn
alpha = 1.0               # pheromone weight
beta = 3.0                # heuristic weight
rho = 0.1                 # evaporation
epsilon = 0.1             # epsilon-greedy exploration
tau_min = 0.1            # MMAS lower bound
tau_max = 10.0           # MMAS upper bound
lambda_elite = 0.5       # elitism deposit weight

[quality]
w_self = 0.25
w_peers = 0.25
w_virgin = 0.25
w_structural = 0.25
peer_aggregation = "median"   # "median" | "reputation"

[direction]
ref_weight = 0.7          # favor fundamentals (references)
cites_weight = 0.3       # impact (citants)

[heuristica]
w_sim = 0.6              # embedding similarity weight
w_citas = 0.2            # citation count weight
w_recencia = 0.2         # recency weight
w_confidence = 0.1       # provider/verification confidence weight
w_llm = 0.2              # LLM-priority weight (used only when eta_llm = true)
eta_llm = false          # false = pure components (cheap); true = include LLM priority

[providers]
default = "arxiv"
active = ["arxiv", "openalex"]

[providers.semantic_scholar]
rate = 1                  # 1 req per 3s (unauthenticated ~100 req/5min)
period = 3
concurrency = 3
timeout = 30.0
api_key_env = "S2_API_KEY"

[providers.openalex]
rate = 10                 # 10 req/s
period = 1
concurrency = 10
timeout = 30.0
api_key_env = "OPENALEX_API_KEY"

[providers.pubmed]
rate = 10                 # 10 req/s with key
period = 1
concurrency = 5
timeout = 30.0
api_key_env = "PUBMED_API_KEY"

[providers.arxiv]
rate = 1                  # 1 req per 3s recommended (be polite)
period = 3
concurrency = 3
timeout = 30.0

[budget]
type = "fetches"          # "fetches" | "time" | "convergence"
max_fetches = 500
max_time_seconds = 3600

[convergence]
plateau_T = 10
epsilon = 0.01
theta = 5.0

[scheduler]
gamma = 0.5              # frontier expected-value weight
delta = 0.3             # remaining-budget weight

[resolution]
enabled = false           # opt-in: canonical cross-provider expansion of graph traversal
primary = "openalex"      # primary source for incoming cited-by + outgoing referenced-works
fallbacks = ["semantic_scholar"]   # fallback/enrichment when the primary yields nothing
incoming_enabled = true
outgoing_enabled = true
incoming_limit = 50       # max verified incoming neighbors per node
outgoing_limit = 50       # max verified outgoing neighbors per node
title_search_limit = 5    # candidates fetched per title-only verification
min_title_similarity = 0.82
min_author_overlap = 0.34
min_confidence = 0.75
year_tolerance = 2

[reference_mapping]
enabled = true            # paper-level shared bibliography mapping (full-text providers)
batch_size = 10           # entries per LLM mapping call
max_concurrent_batches = 2
max_retries = 2           # retries only for malformed/missing items
lease_seconds = 300       # SQLite job lease for single-flight ownership
model = ""                # empty => llm.explorer_model
max_completion_tokens_per_batch = 1500
min_parse_confidence = 0.3
allow_provisional_nodes = true
max_entries = 0           # 0 = all entries; >0 is an explicit safety ceiling
mapper_version = "v1"
prompt_version = "v1"

[storage]
db_path = "data/explorer.db"
cache_dir = "data/.cache"

[memory]
enabled = true            # structured per-paper memory + derived synthesis (SURV-2/3/4)
synthesis_words = 2000    # safe default for a detailed research briefing
chunk_chars = 12000       # bounded full-text chunk size for dossier extraction
max_chunks = 8            # bounded number of full-text chunks retained per paper

[examination]
enabled = false           # opt-in hidden examination + matched naive baseline
examiner_provider = "openai"          # examiner is a separate provider, not the NaN endpoint
examiner_base_url = "https://api.openai.com/v1"
examiner_api_key_env = "OPENAI_API_KEY"
examiner_model = "gpt-5.6-sol"
examiner_reasoning_effort = "medium"
examiner_temperature = 0.2
examiner_max_tokens = 4000
selection_count = 30
holdout_count = 20
options_per_item = 4
partition_seed = 0
max_validation_attempts = 2
allow_examiner_fallback = false       # a fallback must be explicit
fallback_examiner_model = ""
min_examination_coverage = 0.5
require_both_partitions = true
evidence_max_chars = 40000
answer_model = ""                     # empty => examiner is not assumed to answer both arms
answer_temperature = 0.0
answer_max_tokens = 1500
answer_batch_size = 5
answer_reasoning_effort = ""

[terminal_selection]
w_selection = 0.70
w_process = 0.20
w_grounding = 0.10

[baseline]
enabled = true
context_max_chars = 40000
